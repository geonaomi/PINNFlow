[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnflow"
description = ""
version = "1.0.0"
readme = "README.md"
authors = [
{ name="Naomi Shakespeare-Rees", email="eenmsr@leeds.ac.uk" },
]

requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "chaosmagpy>=0.14",
    "torch>=2.5.0",
    "h5py>=3.12.1",
    "matplotlib>=3.9.2",
    "cartopy>=0.24.1"
]

[project.optional-dependencies]
test = [
    "pytest==6.2.5",
]
