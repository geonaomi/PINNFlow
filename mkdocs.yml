site_name: PinnFlow Documentation
site_url: http://pinnflow.readthedocs.io/
repo_url: https://github.com/geonaomi/PINNFlow?tab=readme-ov-file
theme:
  name: "readthedocs"

plugins:
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths: [src]  # search packages in the src folder

nav:
  - Home: index.md
  - Installation : install.md
  - Loading Data : data.md
  - Defining Neural Networks : nn.md
  - Training : train.md
  - Examples : examples.md
  - License : license.md